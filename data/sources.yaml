# Discovery sources that point to the sponsor's own apply page.
# Skip Bold.org / Unigo / Scholarships360-style boards where you only apply on the aggregator.
# Skip comment boards, wikis, and LLM/chat pages — scraped HTML is untrusted.
#
# Prefer university, state, community-foundation, and professional-society portals.
# Those have smaller, eligibility-gated pools (KU students, Kansas residents,
# local geography, or paid membership) and you apply on the sponsor site.

listing_sites:
  # University of Kansas — KU students only
  - name: KU AcademicWorks UKASH
    url: https://ku.academicworks.com/
    section: General Undergraduate
  - name: KU Financial Aid Scholarships
    url: https://financialaid.ku.edu/understand-aid/scholarships
    section: General Undergraduate
  - name: KU School of Engineering Scholarships
    url: https://engr.ku.edu/undergraduate-scholarships
    section: STEM & Engineering
  - name: KU Engineering Current Student Scholarships
    url: https://engr.ku.edu/impact-and-belonging-scholarships
    section: STEM & Engineering
  - name: KU EECS Scholarships
    url: https://eecs.ku.edu/scholarships
    section: Computer Science & Software

  # Kansas state programs — Kansas residents
  - name: Kansas Board of Regents Scholarships
    url: https://kansasregents.gov/students/student_financial_aid/scholarships_and_grants
    section: First-generation & Immigrant

