name: Discover scholarships

on:
  schedule:
    # Every 3 days at 14:00 UTC (9:00 AM Central during daylight time)
    - cron: "0 14 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install httpx beautifulsoup4 lxml pyyaml python-dateutil

      - name: Discover and render listings
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m scholarshipx discover --no-search

      - name: Commit listing updates
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholarships.json data/conferences.json data/notion_scholarships.json README.md ARCHIVE.md
          if git diff --staged --quiet; then
            echo "No listing changes"
          else
            git commit -m "Refresh scholarship listings"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
